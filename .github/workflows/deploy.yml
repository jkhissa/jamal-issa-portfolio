name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via rsync
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "--- Key fingerprint ---"
          ssh-keygen -l -f /tmp/deploy_key
          echo "--- Attempting connection ---"
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -v -o StrictHostKeyChecking=no" \
            dist/ deploy@${{ secrets.VPS_HOST }}:/var/www/issa-tech/
          rm -f /tmp/deploy_key
